<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>CareerConnect - Apply</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h2>Job Application</h2>

        <p>Apply for your selected position.</p>

        <form action="apply" method="post">

            <input type="text"
                   name="name"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   required>

            <input type="text"
                   name="job"
                   placeholder="Job Title"
                   required>

            <input type="text"
                   name="education"
                   placeholder="Education"
                   required>

            <input type="text"
                   name="skills"
                   placeholder="Skills"
                   required>

            <button type="submit">
                Submit Application
            </button>

        </form>

        <p>
            <a href="jobs.html">Back to Jobs</a>
        </p>

    </div>

</body>

</html>
