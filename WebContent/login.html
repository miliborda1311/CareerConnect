<!DOCTYPE html>
<html>
<head>
    <title>CareerConnect - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h2>Welcome Back</h2>

        <p>Login to continue your CareerConnect journey.</p>

        <form action="login" method="post">

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

    </div>

</body>
</html>
