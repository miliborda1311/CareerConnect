<!DOCTYPE html>
<html>
<head>
    <title>CareerConnect - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h2>Join CareerConnect</h2>

        <p>Create your account and start your career journey.</p>

        <form action="register" method="post">

            <input type="text"
                   name="name"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <input type="text"
                   name="phone"
                   placeholder="Phone Number"
                   required>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</body>
</html>
